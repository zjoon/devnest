<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- LEFT -->
    <div class="left">

        <h1 class="title">
            WELCOME BACK!
        </h1>

        <img src="burger.png" alt="Burger" class="burger-img">

    </div>

    <!-- RIGHT -->
    <div class="right">

        <input type="text" placeholder="Enter your name" class="input-box">
        <input type="email" placeholder="Enter your email" class="input-box">
        <input type="tel" placeholder="Enter your number" class="input-box">
        <input type="password" placeholder="Enter password" class="input-box dark-box">
        <input type="password" placeholder="Confirm password" class="input-box">

        <button class="signup-btn">Sign up</button>

    </div>

</body>

</html>
