<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="left">
        <img src="pizza.jpg" alt="Pizza" class="pizza-img">
    </div>

    <div class="right">

        <input type="email" placeholder="Enter email" class="input-box">

        <input type="password" placeholder="Enter password" class="input-box">

        <button class="login-btn">Login</button>

        <a href="#" class="forget">Forget password?</a>

        <div class="social-column">
            <button class="social-btn">🅶 Continue with Google</button>
            <button class="social-btn">𝖋 Continue with Facebook</button>
        </div>

        <div class="signup">
            Don’t have an account?
            <a href="#">Sign up</a>
        </div>

    </div>

</body>

</html>
